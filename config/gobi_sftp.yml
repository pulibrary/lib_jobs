default: &default
  output_sftp_base_dir: '/holdings'
  working_directory: '/tmp/gobi'
  gobi_account_code: <%= ENV['GOBI_ACCOUNT_CODE'] || '123499' %>

development:
  <<: *default
  working_directory: 'tmp/gobi'

test:
  <<: *default
  working_directory: 'spec/fixtures/gobi'
  gobi_account_code: '123499'

staging: &staging
  <<: *default

production:
  <<: *staging
